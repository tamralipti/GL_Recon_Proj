bundle:
  name: stock-cash-reconciliation

workspace:
  root_path: /Workspace/Users/tamralipti@icloud.com/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    workspace:
      host: https://your-dev-workspace.cloud.databricks.com
  prod:
    workspace:
      host: https://your-prod-workspace.cloud.databricks.com

resources:
  jobs:
    Source_To_Bronze_Pipelines:
      name: Source_To_Bronze_Pipelines
      tasks:
        - task_key: BronzeLoadParameters
          notebook_task:
            notebook_path: ./notebooks/00_file_parameters
            source: WORKSPACE
        - task_key: SourceToBronzeLoad
          depends_on:
            - task_key: BronzeLoadParameters
          for_each_task:
            inputs: "{{tasks.BronzeLoadParameters.values.Output_Datasets}}"
            task:
              task_key: SourceToBronzeLoad_iteration
              notebook_task:
                notebook_path: ./notebooks/01_source_to_bronze_load
                base_parameters:
                  file_name: "{{input.file_name}}"
                source: WORKSPACE
        - task_key: Load_in_Bronze_table
          depends_on:
            - task_key: SourceToBronzeLoad
          for_each_task:
            inputs: "{{tasks.BronzeLoadParameters.values.Output_Datasets}}"
            task:
              task_key: Load_in_Bronze_table_iteration
              notebook_task:
                notebook_path: ./notebooks/02_bronze_delta_to_bronze_table
                base_parameters:
                  file_name: "{{input.file_name}}"
                source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

    Bronze_To_Silver_Pipelines:
      name: Bronze_To_Silver_Pipelines
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - glrecon.bronze.product_master
            - glrecon.bronze.cash_transactions
            - glrecon.bronze.stock_transactions
            - glrecon.bronze.overhead_costs
          condition: ALL_UPDATED
      tasks:
        - task_key: Cash_Transaction_Silver_Load
          notebook_task:
            notebook_path: ./notebooks/04_Cash_Transaction_Silver_Layer
            source: WORKSPACE
        - task_key: Overhead_Silver_Load
          notebook_task:
            notebook_path: ./notebooks/06_Overhead_Silver_Layer
            source: WORKSPACE
        - task_key: Product_Silver_Load
          notebook_task:
            notebook_path: ./notebooks/03_Product_Silver_Layer
            source: WORKSPACE
        - task_key: Stock_Transaction_Silver_Load
          notebook_task:
            notebook_path: ./notebooks/05_Stock_Transaction_Silver_Layer
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

    Silver_To_Gold_Pipelines:
      name: Silver_To_Gold_Pipelines
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - glrecon.gold.gold_dim_products
            - glrecon.gold.gold_fact_daily_gl_summary
            - glrecon.gold.gold_fact_stock_cash_recon
          condition: ALL_UPDATED
      tasks:
        - task_key: Daily_GL_Gold_Load
          depends_on:
            - task_key: Product_Gold_Load
          notebook_task:
            notebook_path: ./notebooks/09_Fact_Daily_GL_Summary_Gold_Layer
            source: WORKSPACE
        - task_key: Product_Gold_Load
          notebook_task:
            notebook_path: ./notebooks/07_Dim_Product_Gold_Layer
            source: WORKSPACE
        - task_key: Stock_Cash_Gold_Load
          depends_on:
            - task_key: Product_Gold_Load
          notebook_task:
            notebook_path: ./notebooks/08_Fact_Stock_Cash_Recon_Gold_Layer
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED